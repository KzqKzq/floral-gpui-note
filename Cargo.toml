[package]
name = "floral-gpui-notepad"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A native GPUI markdown notepad starter inspired by Floral Notepaper."
license = "MIT OR Apache-2.0"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.19"
global-hotkey = "0.7"
keyboard-types = "0.7"
winapi = { version = "0.3", features = ["winuser", "shellapi", "libloaderapi", "processthreadsapi"] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
